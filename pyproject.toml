[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbench-studio"
version = "0.1.0"
description = "Project 6 RAG evaluation and experiment dashboard"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "AbinaSelvamurugan"}]
dependencies = [
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "numpy==2.3.5; python_version >= '3.13'",
    "numpy==2.2.6; python_version < '3.13'",
    "pandas==2.2.3",
    "plotly==6.5.2",
]

[project.optional-dependencies]
dashboard = ["streamlit==1.64.0"]
judge = ["deepeval==4.2.8"]
dev = ["pytest==9.0.2", "ruff==0.13.3"]
all = ["streamlit==1.64.0", "deepeval==4.2.8", "pytest==9.0.2", "ruff==0.13.3"]

[project.scripts]
ragbench = "rag_eval.cli:execute"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
exclude = ["results", "data"]
