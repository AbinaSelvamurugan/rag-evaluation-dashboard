name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project with test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run unit and controlled integration tests
        run: python -m pytest -q
      - name: Check Python source compiles
        run: python -m compileall -q src app
